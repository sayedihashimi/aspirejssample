name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dotnet-install script
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh

      - name: Install latest .NET SDK (STS)
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet"
          ./dotnet-install.sh --channel STS --quality ga --install-dir "$RUNNER_TEMP/dotnet"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> $GITHUB_ENV
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/dotnet:$RUNNER_TEMP/dotnet/tools" >> $GITHUB_PATH
      - name: Display dotnet version
        run: dotnet --info

      - name: Install Aspire CLI (native script)
        run: |
          curl -sSL https://aspire.dev/install.sh -o aspire-install.sh
          chmod +x aspire-install.sh
          ./aspire-install.sh
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH
          if [ ! -f "$HOME/.aspire/bin/aspire" ]; then echo 'Aspire CLI not found after install'; ls -R "$HOME/.aspire" || true; exit 1; fi
          "$HOME/.aspire/bin/aspire" --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        run: dotnet restore react/MyReactApp.sln

      - name: Build solution (Release)
        run: dotnet build react/MyReactApp.sln --configuration Release --no-restore

      - name: (Optional) Publish AppHost
        if: false
        run: dotnet publish react/MyReactApp.AppHost/MyReactApp.AppHost.csproj -c Release --no-restore
